<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a6b"/>
      <stop offset="0.55" stop-color="#4b3aa8"/>
      <stop offset="1" stop-color="#0f8f8a"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfdcff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#0a1040" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS-style squircle -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
  <!-- sun glow + sun peeking from behind the cloud -->
  <circle cx="676" cy="368" r="270" fill="url(#glow)"/>
  <g stroke="#ffd166" stroke-width="26" stroke-linecap="round" opacity="0.9">
    <line x1="676" y1="188" x2="676" y2="146"/><line x1="803" y1="241" x2="833" y2="211"/>
    <line x1="856" y1="368" x2="898" y2="368"/><line x1="549" y1="241" x2="519" y2="211"/>
  </g>
  <circle cx="676" cy="368" r="132" fill="url(#sun)"/>
  <!-- the nook: a soft cloud -->
  <g filter="url(#shadow)">
    <path fill="url(#cloud)" d="M286 740a124 124 0 0 1 8-247 180 180 0 0 1 348-32 112 112 0 0 1 56 212 112 112 0 0 1-30 67z"/>
  </g>
  <!-- cozy details: a reminder dot and a check, hinting tasks/notes -->
  <circle cx="392" cy="612" r="30" fill="#4b3aa8" opacity="0.9"/>
  <path d="M376 612l12 13 24-28" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="452" y="596" width="176" height="14" rx="7" fill="#4b3aa8" opacity="0.35"/>
  <rect x="452" y="626" width="120" height="14" rx="7" fill="#4b3aa8" opacity="0.22"/>
